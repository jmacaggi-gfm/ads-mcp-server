[project]
name = "ads-mcp-server"
version = "0.1.0"
description = "Local MCP server exposing Google Ads + Meta Marketing data to Claude (Cowork)"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.2.0",
    "google-ads>=25.0.0",
    "facebook-business>=20.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
]

[project.scripts]
ads-mcp-server = "ads_mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "freezegun>=1.5.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
